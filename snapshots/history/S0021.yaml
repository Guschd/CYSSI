snapshot:

  id: S0021
  type: full
  version: 0.21.0
  status: LOCKED

project:

  name: CYSSI Framework
  type: Canonical Project State Management Framework
  maturity: Public Pre-Release

vision:

  goal: >
    Develop a model-independent open-source framework
    for managing long-term human-AI collaboration.

  principle: >
    The chat is temporary.
    Your project shall not.

contract:

  chat_is_memory: false
  chat_is_transport: true
  project_state_is_primary: true
  reproduce_before_reconstruct: true
  deterministic_before_creative: true
  explicit_decisions_required: true
  consolidate_every_session: true
  canonical_documents_are_locked: true

locked_facts:

  - The framework name is CYSSI.
  - The canonical project state is the only authoritative source of truth.
  - Conversations transport information only.
  - Every conversation ends with a snapshot.
  - Every full snapshot completely describes the canonical project state.
  - Full snapshots are independently reproducible.
  - Change snapshots require a base snapshot.
  - Template snapshots define structure only.
  - CDL directives are processed before conversational inference.
  - Documentation is written before implementation.
  - Normative specifications are separated from documentation.
  - Markdown output follows the CYSSI Markdown Output Rule.
  - The README is the public entry point of the repository.
  - The official logo is part of the CYSSI identity.
  - The official slogan is:
    "The chat is temporary. Your project shall not."

- A snapshot is not a backup.
  - A snapshot is the validated result of one completed reasoning cycle.
  - Every Full Snapshot concludes one Closed-Loop cycle.
  - Historical snapshots exist for traceability rather than reconstruction.




  - LLM conversations are volatile working environments.
  - Chat history is not durable project storage.
  - Every accepted snapshot SHALL be archived externally.
  - Canonical project state and Project History are distinct concepts.
  - Full Snapshots provide logical reconstruction.
  - Project History provides historical traceability.

