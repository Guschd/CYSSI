#
# CYSSI Snapshot
#
# Canonical project state.
#
# Snapshot ID: S0007
#
snapshot:
  id: S0007
  version: 0.7.0
  status: LOCKED
project:
  name: CYSSI Framework
  type: Project State Management Framework
  maturity: Public Pre-Release
vision:
  goal: >
    Develop a model-independent open-source framework
    for managing long-term human-AI projects.
  principle: >
    The chat is not the source of truth.
    The canonical project state is.
contract:
  chat_is_memory: false
  chat_is_transport: true
  project_state_is_primary: true
  reproduce_before_reconstruct: true
  deterministic_before_creative: true
  explicit_decisions_required: true
  consolidate_every_session: true
locked_facts:
  - The framework name is CYSSI.
  - The project state is the only authoritative knowledge source.
  - Conversations transport information only.
  - Every conversation ends with a snapshot.
  - CDL directives have priority over conversational inference.
  - The official logo is part of the CYSSI identity.
  - The README is the public entry point of the project.
  - The snapshot template follows a Unix-style configuration layout.
components:
  - Context Bubble
  - Project Contract
  - Locked Facts
  - Conversation Compiler
  - CYSSI Directive Language
  - Semantic Compression
  - Context Snapshot
  - Conversation Lifecycle
branding:
  slogan: >
    The chat is temporary.
    The project state is forever.
decision_log:
  - id: D0001
    status: accepted
    decision: Chat is not memory.
  - id: D0002
    status: accepted
    decision: The project state is the primary knowledge source.
  - id: D0003
    status: accepted
    decision: Every conversation ends with a snapshot.
  - id: D0004
    status: accepted
    decision: The framework name is CYSSI.
  - id: D0005
    status: accepted
    decision: CYSSI introduces the Directive Language (CDL).
  - id: D0006
    status: accepted
    decision: The repository starts with a README.
  - id: D0007
    status: accepted
    decision: The generated logo becomes the official project identity.
  - id: D0008
    status: accepted
    decision: The README serves as the public landing page.
  - id: D0009
    status: accepted
    decision: The official snapshot template adopts a Unix-style configuration layout with commented optional sections.
change_log:
  - snapshot: S0007
    changes:
      - Snapshot template redesigned.
      - Unix configuration style adopted.
      - Optional sections converted to commented placeholders.
      - README finalized for GitHub publication.
      - Reference snapshot specification simplified.
