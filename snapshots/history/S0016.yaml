    - CSP-0002-Project-Contract.md
    - CSP-0003-Locked-Facts.md
    - CSP-0004-CDL.md
    - CSP-0005-Conversation-Compiler.md
    - CSP-0006-Semantic-Compression.md
    - CSP-0007-Context-Diff.md
    - CSP-0008-Snapshot-Merge.md
    - CSP-0009-Validation.md

  examples:

    - example_snapshot.yaml
    - minimal_snapshot.yaml
    - complete_snapshot.yaml
    - hello_cyssi/

  schema:

    - snapshot.schema.json
    - snapshot.schema.yaml

documentation:

  completed:

    - README.md
    - docs/Introduction.md
    - docs/Architecture.md
