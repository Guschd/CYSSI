    - specs/CSP-0009-Validation.md

output_rules:

  markdown:

    wrap_if_codeblocks: true
    wrap_without_codeblocks: false

decision_log:

  - id: D0001
    status: accepted
    decision: Chat is not memory.

  - id: D0002
    status: accepted
    decision: The project state is the primary knowledge source.

  - id: D0003
    status: accepted
    decision: Every conversation ends with a snapshot.

  - id: D0004
    status: accepted
    decision: The framework name is CYSSI.

  - id: D0005
    status: accepted
    decision: CYSSI introduces the Directive Language (CDL).

  - id: D0006
    status: accepted
    decision: Every public repository starts with a README.

  - id: D0007
    status: accepted
    decision: The generated logo becomes the official project identity.

  - id: D0008
    status: accepted
    decision: The README serves as the public landing page.

  - id: D0009
    status: accepted
    decision: The official snapshot template adopts a Unix-style configuration layout.

  - id: D0010
    status: accepted
    decision: Repository documentation and normative specifications are separated into docs/ and specs/.

  - id: D0011
    status: accepted
    decision: Documentation is written before implementation.

  - id: D0012
    status: accepted
    decision: Architecture.md is the second canonical documentation.

  - id: D0013
    status: accepted
    decision: Project_Contract.md is the third canonical documentation.

  - id: D0014
    status: accepted
    decision: Markdown output follows the CYSSI Markdown Output Rule.

  - id: D0015
    status: accepted
    decision: CDL.md is the fourth canonical documentation.

  - id: D0016
    status: accepted
    decision: CDL evolves into the deterministic Project State Management Language (PSML) of CYSSI.

  - id: D0017
    status: accepted
    decision: CDL supports snapshot restore, rollback, reversible state changes, history navigation and transactional execution.

  - id: D0018
    status: accepted
    decision: CDL v1 defines a minimal, orthogonal instruction set based on generic state operations. Specialized directives are intentionally excluded.

  - id: D0019
    status: accepted
    decision: CDL v1 addresses snapshot elements using simple dot notation. JSONPath/YAMLPath-inspired selector syntax is reserved for future framework versions.

change_log:

  - snapshot: S0016

    changes:

      - Refactored CDL.md according to D0018.
      - Removed specialized directives from the public specification.
      - Replaced command-specific operations with generic state operations.
      - Simplified directive categories.
      - Updated examples to use @set, @unset, @add, @remove, @replace, @move and @rename.
      - Preserved D0019 as an internal architectural decision only.

