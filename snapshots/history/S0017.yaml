# Summary

This snapshot records the redesign of the project README.

The README is no longer treated as a condensed specification. Instead, it becomes the primary entry point into the CYSSI Framework by explaining the problem first, followed by the solution, architecture and specifications.

---

# Locked Facts

- The README introduces the framework before describing its specifications.
- The README follows a documentation-first approach instead of a specification-first approach.
- Technical precision remains unchanged while readability is improved.

