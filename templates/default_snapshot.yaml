#
# CYSSI Default Snapshot
#
# Canonical bootstrap project state.
#
# This template is copied when initializing a new CYSSI project.
#

snapshot:

  id: S0000
  version: 0.17.0
  status: TEMPLATE

project:

  name: New CYSSI Project
  type: Canonical Project State Management Framework
  maturity: Initial

vision:

  goal: >
    Develop a model-independent open-source framework
    for managing long-term human-AI collaboration.

  principle: >
    The chat is temporary.
    The project state is forever.

contract:

  chat_is_memory: false
  chat_is_transport: true
  project_state_is_primary: true
  reproduce_before_reconstruct: true
  deterministic_before_creative: true
  explicit_decisions_required: true
  consolidate_every_session: true

locked_facts:

  - The framework name is CYSSI.
  - The canonical project state is the only authoritative source of truth.
  - Conversations transport information only.
  - Every conversation ends with a snapshot.
  - CDL directives are processed before conversational inference.
  - The official logo is part of the CYSSI identity.
  - The README is the public entry point of the repository.
  - The official snapshot template follows the Unix configuration style.
  - Normative specifications are separated from documentation.
  - The repository structure is canonical.
  - Documentation is written before implementation.
  - Markdown output follows the CYSSI Markdown Output Rule.
  - CDL is the deterministic interface for manipulating the canonical project state.
  - State-changing CDL directives should be reversible whenever possible.
  - CDL supports transactional processing.
  - CDL v1 defines a minimal, orthogonal instruction set based on generic state operations.

components:

  - Conversation
  - Conversation Compiler
  - Project Contract
  - Locked Facts
  - Decision Log
  - CYSSI Directive Language
  - Snapshot Generator
  - Canonical Project State

branding:

  slogan: >
    The chat is temporary.
    The project state is forever.

repository:

  root:

    - README.md
    - LICENSE
    - CONTRIBUTING.md

  docs:

    - Introduction.md
    - Architecture.md
    - Project_Contract.md
    - CDL.md
    - Snapshots.md
    - Best_Practices.md
    - FAQ.md
    - Glossary.md

  specs:

    - CSP-0001-Snapshot-Specification.md
    - CSP-0002-Project-Contract.md
    - CSP-0003-Locked-Facts.md
    - CSP-0004-CDL.md
    - CSP-0005-Conversation-Compiler.md
    - CSP-0006-Semantic-Compression.md
    - CSP-0007-Context-Diff.md
    - CSP-0008-Snapshot-Merge.md
    - CSP-0009-Validation.md

  schema:

    - snapshot.schema.json
    - snapshot.schema.yaml

  templates:

    - default_snapshot.yaml

  examples:

    - minimal_snapshot.yaml
    - complete_snapshot.yaml
    - hello_cyssi/

documentation:

  completed:

    - README.md
    - docs/Introduction.md
    - docs/Architecture.md
    - docs/Project_Contract.md
    - docs/CDL.md

  pending:

    - docs/Snapshots.md
    - docs/Best_Practices.md
    - docs/FAQ.md
    - docs/Glossary.md

    - specs/CSP-0001-Snapshot-Specification.md
    - specs/CSP-0002-Project-Contract.md
    - specs/CSP-0003-Locked-Facts.md
    - specs/CSP-0004-CDL.md
    - specs/CSP-0005-Conversation-Compiler.md
    - specs/CSP-0006-Semantic-Compression.md
    - specs/CSP-0007-Context-Diff.md
    - specs/CSP-0008-Snapshot-Merge.md
    - specs/CSP-0009-Validation.md

output_rules:

  markdown:

    wrap_if_codeblocks: true
    wrap_without_codeblocks: false

decision_log: []

change_log: []

