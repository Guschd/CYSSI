#
# CYSSI Example Snapshot
#
# Demonstrates the canonical structure of a Full Snapshot.
#

snapshot:

  id: S0003
  type: full
  version: 0.18.0
  status: LOCKED

project:

  name: Example Inventory System
  type: Software Project
  maturity: Prototype

vision:

  goal: >
    Build a lightweight inventory management application
    for small businesses.

  principle: >
    Keep the system simple, reliable and maintainable.

contract:

  chat_is_memory: false
  chat_is_transport: true
  project_state_is_primary: true
  reproduce_before_reconstruct: true
  deterministic_before_creative: true
  explicit_decisions_required: true
  consolidate_every_session: true

locked_facts:

  - The primary programming language is Python.
  - PostgreSQL is the production database.
  - REST is the public API.
  - Docker is required for deployment.

components:

  - Backend API
  - Database
  - Authentication
  - Web Frontend
  - Documentation

branding:

  slogan: >
    Simple inventory management.

repository:

  root:

    - README.md
    - LICENSE

  docs:

    - Architecture.md
    - API.md

  specs:

    - CSP-Example.md

documentation:

  completed:

    - README.md

  pending:

    - Architecture.md
    - API.md

output_rules:

  markdown:

    wrap_if_codeblocks: true
    wrap_without_codeblocks: false

decision_log:

  - id: D0001
    status: accepted
    decision: Python is selected as the implementation language.

  - id: D0002
    status: accepted
    decision: PostgreSQL is used as the primary database.

change_log:

  - snapshot: S0003

    changes:

      - Initial project snapshot created.

history:

  predecessor:
  successor: